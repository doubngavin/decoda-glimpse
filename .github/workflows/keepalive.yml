# Keeps the Render Free instance awake so Gumroad pings are not lost and
# /tmp orders (approve links) survive. Render Free gives 750 h/month; one
# always-on service uses about 720 h. GitHub disables scheduled workflows in a
# repo with no commits for 60 days: push any change to re-enable.
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://decoda-glimpse.onrender.com/ > /dev/null
